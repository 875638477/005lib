<text x="762" y="707.3050000000001" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#1e293b">BOTTOM  |  0.03500 mm</text>
<rect x="750" y="719.3050000000001" width="635" height="36" fill="#b5a5e8" stroke="#ffffff" stroke-width="2"/>
