<text x="40" y="786.9" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#1e293b">Factory order nominal thickness = 1.6 mm (separate datum)</text>
<text x="750" y="132" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1e293b">JLC04161H-7628</text>
<text x="750" y="164" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#1e293b">CAD copper order: TOP - L2 - L3 - BOTTOM</text>
