<text x="40" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1e293b">Lesson 28 | Native 2-layer / 4-layer cross sections</text>
<text x="40" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#1e293b">Allegro 17.2 S045. Reopened native database values; diagram uses a minimum visible row height.</text>
