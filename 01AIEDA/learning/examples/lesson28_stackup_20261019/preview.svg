<text x="750" y="790.3050000000001" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1e293b">Copper + dielectric = 1.58620 mm</text>
<text x="750" y="820.3050000000001" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#1e293b">Including modeled mask = 1.61668 mm</text>
<text x="750" y="850.3050000000001" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#1e293b">Factory order nominal thickness = 1.6 mm (separate datum)</text>
<text x="40" y="900" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#1e293b">Teaching through-via: 0.30 mm finished hole / 0.60 mm regular copper, TOP through BOTTOM.</text>
<text x="40" y="935" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#1e293b">Confirmed: 80 components, 69 nets, 22 placed physical pins; 6 NPTHs remain copper-free on every layer.</text>
<text x="40" y="970" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#1e293b">4-layer intent: TOP signal/power - L2 continuous GND - L3 continuous GND - BOTTOM signal/power.</text>
<text x="40" y="1005" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#9a3412">L2/L3 planes have NOT been poured yet. The numeric stackup does not prove a valid return path.</text>
<text x="40" y="1040" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#9a3412">90-ohm USB trace width / spacing remains subject to the actual factory impedance stackup.</text>
<text x="40" y="1075" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#1e293b">JLC mask: flat C2 model only. Df defaults / 2L purple-mask Dk are not qualified material data.</text>
<text x="40" y="1110" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#1e293b">Source tables, deviations, raw readback, challenge logs and validation.json are archived in this lesson directory.</text>
<text x="40" y="1150" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#9a3412">2L fabrication release: inherited USB mask web 0.100 mm is below OSH minimum 0.1016 mm.</text>
</svg>