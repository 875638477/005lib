<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style type="text/css"><![CDATA[
      .t { font: 700 24px sans-serif; fill: #111111; }
      .h { font: 700 14px sans-serif; fill: #111111; }
      .s { font: 12px sans-serif; fill: #222222; }
    ]]></style>
  </defs>
  <rect width="1200" height="800" fill="#f4f6f5"/>
  <text x="40" y="40" class="t">Dual Backplane PCB Layout Sketch (Top View)</text>
  <text x="40" y="65" class="s">Board outline follows the cage; this sketch shows zones and current flow</text>

  <rect x="80" y="100" width="1040" height="560" fill="#ffffff" stroke="#333333" stroke-width="3"/>

  <rect x="110" y="150" width="120" height="280" fill="#dceee9" stroke="#1f4e5f" stroke-width="2"/>
  <text x="135" y="190" class="h">J1</text>
  <text x="120" y="220" class="s">SLOT A</text>
  <text x="120" y="245" class="s">64Pin</text>
  <text x="120" y="320" class="s">signal end</text>
  <text x="120" y="345" class="s">outward</text>

  <rect x="970" y="150" width="120" height="280" fill="#dceee9" stroke="#1f4e5f" stroke-width="2"/>
  <text x="995" y="190" class="h">J2</text>
  <text x="980" y="220" class="s">SLOT B</text>
  <text x="980" y="245" class="s">64Pin</text>
  <text x="980" y="320" class="s">signal end</text>
  <text x="980" y="345" class="s">mirrored</text>

  <rect x="280" y="180" width="640" height="100" fill="#ffd7a8" stroke="#b85c38" stroke-width="2"/>
  <text x="430" y="235" class="h">VBUS_12V thick copper / solder open</text>

  <rect x="280" y="300" width="640" height="80" fill="#cfe8d8" stroke="#1f5d3a" stroke-width="2"/>
  <text x="520" y="345" class="h">PGND plane</text>

  <rect x="280" y="420" width="200" height="120" fill="#e7ecff" stroke="#3d4a8f" stroke-width="2"/>
  <text x="320" y="455" class="h">CTRL A</text>
  <text x="300" y="485" class="s">PRE/EN/LED</text>
  <text x="300" y="510" class="s">ADR A</text>

  <rect x="500" y="420" width="200" height="120" fill="#e7ecff" stroke="#3d4a8f" stroke-width="2"/>
  <text x="545" y="455" class="h">PMBus</text>
  <text x="520" y="485" class="s">pull-up/LDO/J3</text>
  <text x="520" y="510" class="s">keep quiet</text>

  <rect x="720" y="420" width="200" height="120" fill="#e7ecff" stroke="#3d4a8f" stroke-width="2"/>
  <text x="760" y="455" class="h">CTRL B</text>
  <text x="740" y="485" class="s">PRE/EN/LED</text>
  <text x="740" y="510" class="s">ADR B strap</text>

  <circle cx="360" cy="620" r="28" fill="#ffb080" stroke="#883333"/>
  <circle cx="460" cy="620" r="28" fill="#ffb080" stroke="#883333"/>
  <circle cx="720" cy="620" r="28" fill="#8fd0a8" stroke="#225555"/>
  <circle cx="820" cy="620" r="28" fill="#8fd0a8" stroke="#225555"/>
  <text x="330" y="670" class="s">+12V studs</text>
  <text x="700" y="670" class="s">GND studs</text>

  <text x="80" y="710" class="s">Main current path: J1/J2 power end -&gt; center bus -&gt; studs. Keep left/right paths symmetrical.</text>
  <text x="80" y="735" class="s">Mounting holes: isolate metal screws from 12V pours to avoid chassis shorts.</text>
  <text x="80" y="760" class="s">Hot-plug force is high: teardrops on connector pads + enough mechanical fasteners.</text>
</svg>
