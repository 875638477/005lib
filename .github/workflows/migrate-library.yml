name: Migrate existing EDA library
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-library.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-library-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Migrate and verify library objects
        run: python3 .migration/migrate_server.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: library-migration-evidence
          path: ${{ runner.temp }}/migration-evidence
          if-no-files-found: warn
          retention-days: 30
